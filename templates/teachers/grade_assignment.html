{% extends 'home.html' %}

{% block content %}

<h2>Grade: {{ assignment.title }}</h2>

<form method="POST">
    {% csrf_token %}

    <table class="table">
        <tr>
            <th>Student</th>
            <th>File</th>
            <th>Marks</th>
        </tr>

        {% for sub in submissions %}
        <tr>
            <td>{{ sub.student.name }}</td>
            <td>
                {% if sub.file %}
                    <a href="{{ sub.file.url }}" target="_blank">View</a>
                {% endif %}
            </td>
            <td>
                <input type="number" name="grade_{{ sub.id }}"
                       value="{{ sub.grade|default:'' }}"
                       min="0" max="100">
            </td>
        </tr>
        {% endfor %}
    </table>

    <button class="btn btn-success">Save Grades</button>
</form>

{% endblock %}
