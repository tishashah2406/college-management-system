{% extends 'home.html' %}
{% load static %}

{% block content %}

<div class="dashboard-page">

    <!-- Header -->
    <div class="page-header">
        <h2>📘 Create Assignment</h2>
        <p>Course: <strong>{{ course.name }}</strong></p>
    </div>

    <!-- Form Card -->
    <div class="dashboard-card">

        <form method="POST">
            {% csrf_token %}

            <!-- Title -->
            <div class="mb-3">
                <label><strong>Assignment Title</strong></label>
                <input type="text" name="title" class="form-control" placeholder="Enter title" required>
            </div>

            <!-- Description -->
            <div class="mb-3">
                <label><strong>Description</strong></label>
                <textarea name="description" class="form-control" rows="4" placeholder="Enter description"></textarea>
            </div>

            <!-- Due Date -->
            <div class="mb-3">
                <label><strong>Due Date</strong></label>
                <input type="date" name="due_date" class="form-control" required>
            </div>

            <!-- Buttons -->
            <div style="display:flex; gap:10px; margin-top:20px;">

                <button type="submit" class="btn btn-success">
                    ✅ Create Assignment
                </button>

                <a href="{% url 'teacher_dashboard' %}" class="btn btn-secondary">
                    ⬅ Back
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
