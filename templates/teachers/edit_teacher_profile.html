{% extends 'home.html' %}
{% load static %}

{% block content %}

<style>
    .container-box {
        max-width: 800px;
        margin: auto;
    }

    h2 {
        color: #0f172a;
        margin-bottom: 20px;
    }

    /* Card */
    .card {
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        margin-bottom: 20px;
    }

    /* Form */
    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
        color: #334155;
    }

    input {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
    }

    input:focus {
        border-color: #3498db;
    }

    /* Courses */
    .course-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 10px;
    }

    .course-item {
        background: #f1f5f9;
        padding: 8px 12px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #1e293b;
    }

    /* Buttons */
    .btn {
        padding: 8px 15px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        margin-right: 10px;
        transition: 0.3s;
    }

    .btn-save {
        background: #2ecc71;
        color: white;
    }

    .btn-save:hover {
        background: #27ae60;
    }

    .btn-cancel {
        background: #64748b;
        color: white;
        text-decoration: none;
        padding: 8px 15px;
        border-radius: 6px;
    }

    .btn-cancel:hover {
        background: #475569;
    }
</style>

<div class="container-box">

    <h2>✏ Edit Teacher Profile</h2>

    <form method="post">
        {% csrf_token %}

        <!-- Info Card -->
        <div class="card">
            <div class="form-group">
                <label>Name</label>
                <input type="text" name="name" value="{{ teacher.name }}" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ teacher.user.email }}" required>
            </div>

            <div class="form-group">
                <label>Salary</label>
                <input type="number" name="salary" value="{{ teacher.salary }}" required>
            </div>

            <div class="mb-3">
            <label for="phone">Phone Number</label>
            <input type="text" name="phone" id="phone" class="form-control" value="{{ teacher.phone }}">
            </div>

        </div>

        <!-- Courses Card -->
        <div class="card">
            <h3>📚 Courses Assigned</h3>

            {% if courses %}
                <div class="course-list">
                    {% for course in courses %}
                        <label class="course-item">
                            <input type="checkbox" name="courses" value="{{ course.id }}"
                                   {% if course in teacher.courses.all %}checked{% endif %}>
                            {{ course.name }}
                        </label>
                    {% endfor %}
                </div>
            {% else %}
                <p>No courses available</p>
            {% endif %}
        </div>

        <!-- Buttons -->
        <button type="submit" class="btn btn-save">Save Changes</button>

        <a href="{% url 'teacher_profile' teacher.id %}" class="btn-cancel">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
