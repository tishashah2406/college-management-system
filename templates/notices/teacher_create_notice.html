{% extends 'home.html' %}
{% load static %}

{% block content %}

<div class="container py-4">

<div class="card shadow border-0 rounded-4">

<div class="card-header bg-primary text-white rounded-top-4">

<h3 class="mb-0">
<i class="bi bi-megaphone-fill"></i>
Create Notice
</h3>

</div>

<div class="card-body">

<form method="POST">

{% csrf_token %}

<div class="mb-3">

<label class="form-label">
Title
</label>

<input
type="text"
name="title"
class="form-control"
required>

</div>


<div class="mb-3">

<label class="form-label">
Notice Type
</label>

<select
name="notice_type"
class="form-select">

<option value="GENERAL">General</option>
<option value="EXAM">Exam</option>
<option value="EVENT">Event</option>
<option value="HOLIDAY">Holiday</option>
<option value="URGENT">Urgent</option>

</select>

</div>


<div class="mb-3">

<label class="form-label">
Course
</label>

<select
name="course"
class="form-select"
required>

{% for course in courses %}

<option value="{{ course.id }}">

{{ course.name }}

</option>

{% endfor %}

</select>

</div>


<div class="mb-3">

<label class="form-label">

Description

</label>

<textarea
name="description"
rows="5"
class="form-control"
required>

</textarea>

</div>


<div class="mb-3">

<label class="form-label">

Expiry Date

</label>

<input
type="date"
name="expiry_date"
class="form-control"
required>

</div>


<div class="text-end">

<button
type="submit"
class="btn btn-primary px-4">

<i class="bi bi-send-fill"></i>

Publish Notice

</button>

</div>

</form>

</div>

</div>

</div>

{% endblock %}
