{% extends 'home.html' %}

{% block content %}
<h2>Delete Course</h2>

<p>Are you sure you want to delete <strong>{{ course.name }}</strong>?</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>

<br>
<a href="{% url 'course_list' %}">Cancel</a>
{% endblock %}
