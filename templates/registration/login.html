{% extends 'home.html' %}

{% block content %}

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
}

.login-container{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
}

.login-card{
    width:400px;
    background:#fff;
    padding:40px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

.login-header{
    text-align:center;
    margin-bottom:30px;
}

.login-header h2{
    margin:0;
    color:#222;
    font-size:32px;
}

.login-header p{
    color:#777;
    margin-top:8px;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
    transition:0.3s;
}

.input-group input:focus{
    border-color:#4f46e5;
    box-shadow:0 0 0 3px rgba(79,70,229,0.15);
}

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#4f46e5;
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#4338ca;
}

.error-msg{
    background:#ffe5e5;
    color:#d63031;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.success-msg{
    background:#e8f8ec;
    color:#27ae60;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}

.register-link{
    text-align:center;
    margin-top:20px;
}

.register-link a{
    color:#4f46e5;
    text-decoration:none;
    font-weight:600;
}

.register-link a:hover{
    text-decoration:underline;
}
</style>

<div class="login-container">

    <div class="login-card">

        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Login to your account</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'error' %}error-msg{% else %}success-msg{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="input-group">
                <label>Username</label>
                <input type="text"
                       name="username"
                       placeholder="Enter your username"
                       required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>
        </form>

        <div class="register-link">
            <p>
                Don't have an account?
                <a href="{% url 'register' %}">
                    Register
                </a>
            </p>
        </div>

    </div>

</div>

{% endblock %}
