{% extends 'base.html' %}

{% block title %}Edit Student Profile{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <h2 class="mb-4">Edit Student Profile</h2>

            <form method="post">
                {% csrf_token %}

                <!-- Name -->
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control"
                           value="{{ student.name }}" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           value="{{ student.user.email }}" required>
                </div>

                <!-- Age -->
                <div class="mb-3">
                    <label class="form-label">Age</label>
                    <input type="number" name="age" class="form-control"
                           value="{{ student.age }}" min="1" max="120">
                </div>

                <!-- Courses -->
                <div class="mb-3">
                    <label class="form-label">Courses</label>

                    {% for course in available_courses %}
                        <div class="form-check">
                            <input type="checkbox"
                                   class="form-check-input"
                                   name="courses"
                                   value="{{ course.id }}"
                                   id="course_{{ course.id }}"
                                   {% if course in student.courses.all %}checked{% endif %}>

                            <label class="form-check-label" for="course_{{ course.id }}">
                                {{ course.name }}
                            </label>
                        </div>
                    {% endfor %}
                </div>

                <!-- Buttons -->
                <button type="submit" class="btn btn-primary">
                    Save Changes
                </button>

                <a href="{% url 'student_dashboard' %}" class="btn btn-secondary"> Cancel</a>

            </form>

        </div>
    </div>
</div>
{% endblock %}
