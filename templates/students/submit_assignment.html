{% extends 'home.html' %}
{% load static %}

{% block content %}

<style>
    .submit-box {
        max-width: 600px;
        margin: auto;
        background: #ffffff;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    }

    h2 {
        color: #0f172a;
        margin-bottom: 20px;
    }

    textarea {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ccc;
        margin-bottom: 15px;
    }

    input[type="file"] {
        margin-bottom: 15px;
    }

    .btn-submit {
        background: #3498db;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 6px;
        cursor: pointer;
    }

    .btn-submit:hover {
        background: #2980b9;
    }
</style>

<div class="submit-box">

    <h2>📤 Submit Assignment - {{ assignment.title }}</h2>

    <!-- 🔥 IMPORTANT: NO action -->
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Write your answer (optional):</label>
        <textarea name="content" rows="5" placeholder="Type your answer..."></textarea>

        <label>Upload file (optional):</label>
        <input type="file" name="file">

        <small>You can submit text, file, or both.</small>

        <br><br>

        <button type="submit" class="btn-submit">Submit</button>
    </form>

</div>

{% endblock %}
